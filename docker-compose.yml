services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: schoolhub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d schoolhub"]
      interval: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
