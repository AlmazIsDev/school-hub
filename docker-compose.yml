services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: schoolhub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d schoolhub"]
      interval: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    environment:
      DATABASE_URL: postgresql+asyncpg://hub:${POSTGRES_PASSWORD}@postgres:5432/schoolhub
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
  bot:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    command: ["python", "-m", "app.bot"]
    environment:
      DATABASE_URL: postgresql+asyncpg://hub:${POSTGRES_PASSWORD}@postgres:5432/schoolhub
      REDIS_URL: redis://redis:6379/0
      VK_TOKEN: ${VK_TOKEN:-}
      VK_GROUP_ID: ${VK_GROUP_ID:-0}
    depends_on: [api]
  frontend:
    build: { context: ., dockerfile: docker/frontend.Dockerfile }
    ports: ["80:80"]
    depends_on: [api]
volumes:
  pgdata:
