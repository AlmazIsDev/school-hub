services:
  mongo:
    image: mongo:7
    ports: ["${MONGO_PORT:-127.0.0.1:27017}:27017"]  # наружу не торчим
    volumes: [mongodata:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-127.0.0.1:6379}:6379"]
  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    ports: ["${API_PORT:-8000}:8000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/schoolhub}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:?}
      JWT_ALG: ${JWT_ALG:-HS256}
      ACCESS_TTL_MIN: ${ACCESS_TTL_MIN:-15}
      REFRESH_TTL_DAYS: ${REFRESH_TTL_DAYS:-7}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Администратор}
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_started }
  bot:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    command: ["python", "-m", "app.bot"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/schoolhub}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:?}
      JWT_ALG: ${JWT_ALG:-HS256}
      ACCESS_TTL_MIN: ${ACCESS_TTL_MIN:-15}
      REFRESH_TTL_DAYS: ${REFRESH_TTL_DAYS:-7}
      VK_TOKEN: ${VK_TOKEN:-}
      VK_GROUP_ID: ${VK_GROUP_ID:-0}
    depends_on: [api]
  frontend:
    build: { context: ., dockerfile: docker/frontend.Dockerfile }
    ports: ["${FRONTEND_PORT:-80}:80"]
    depends_on: [api]
volumes:
  mongodata:
