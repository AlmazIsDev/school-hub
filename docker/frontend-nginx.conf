server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # дефолтные 1m режут загрузку планов 413-й раньше бэкенда (там лимит 5m)
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location /healthz {
        proxy_pass http://api:8000;
    }

    location / {
        try_files $uri /index.html;
    }
}
